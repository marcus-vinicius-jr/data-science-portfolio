name: CI - 03 ML Supervised Pipeline

on:
  push:
    branches: [main]
    paths:
      - "03_ml_supervised_pipeline/**"
      - ".github/workflows/ci-03-ml-supervised-pipeline.yml"
  pull_request:
    paths:
      - "03_ml_supervised_pipeline/**"
      - ".github/workflows/ci-03-ml-supervised-pipeline.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: 03_ml_supervised_pipeline

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: 03_ml_supervised_pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert nbclient

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${KAGGLE_USERNAME}\",\"key\":\"${KAGGLE_KEY}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Execute notebook end-to-end
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            notebooks/03_ml_supervised_pipeline.ipynb \
            --ExecutePreprocessor.timeout=600

      - name: Upload executed notebook as artifact
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook-03
          path: 03_ml_supervised_pipeline/notebooks/03_ml_supervised_pipeline.ipynb
