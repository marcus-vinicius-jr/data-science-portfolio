name: CI - 04 Text Classification Keras

on:
  push:
    branches: [main]
    paths:
      - "04_text_classification_keras/**"
      - ".github/workflows/ci-04-text-classification-keras.yml"
  pull_request:
    paths:
      - "04_text_classification_keras/**"
      - ".github/workflows/ci-04-text-classification-keras.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: 04_text_classification_keras

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: 04_text_classification_keras/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert nbclient

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${KAGGLE_USERNAME}\",\"key\":\"${KAGGLE_KEY}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Execute notebook end-to-end
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            notebooks/04_text_classification_keras.ipynb \
            --ExecutePreprocessor.timeout=1800

      - name: Upload executed notebook as artifact
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook-04
          path: 04_text_classification_keras/notebooks/04_text_classification_keras.ipynb
