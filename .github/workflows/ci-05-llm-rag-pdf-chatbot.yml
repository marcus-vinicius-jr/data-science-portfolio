name: CI - 05 LLM RAG PDF Chatbot

# Two jobs, split by cost:
# - checks:     free, no API key; runs on every push/PR that touches this project (drives the README badge).
# - evaluation: re-runs the whole notebook with the OpenAI API (about US$ 0.72 per run); manual trigger only,
#               needs the repository secret OPENAI_API_KEY.

on:
  push:
    branches: [main]
    paths:
      - "05_llm_rag_pdf_chatbot/**"
      - ".github/workflows/ci-05-llm-rag-pdf-chatbot.yml"
  pull_request:
    paths:
      - "05_llm_rag_pdf_chatbot/**"
      - ".github/workflows/ci-05-llm-rag-pdf-chatbot.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: 05_llm_rag_pdf_chatbot

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: 05_llm_rag_pdf_chatbot/requirements.txt

      - name: Install lightweight dependencies (no PyTorch needed for the checks)
        run: |
          python -m pip install --upgrade pip
          pip install pytest streamlit python-dotenv pypdf chromadb \
            langchain-core langchain-text-splitters langchain-openai langchain-chroma

      - name: Run free checks (evaluation set, executed notebook, chat app without a key)
        run: pytest tests -q

  evaluation:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: 05_llm_rag_pdf_chatbot/requirements.txt

      - name: Check that the OpenAI secret is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository secret OPENAI_API_KEY is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install nbconvert nbclient

      - name: Execute notebook end-to-end
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            notebooks/05_llm_rag_pdf_chatbot.ipynb \
            --ExecutePreprocessor.timeout=3600

      - name: Upload executed notebook as artifact
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook-05
          path: 05_llm_rag_pdf_chatbot/notebooks/05_llm_rag_pdf_chatbot.ipynb
